version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint pins its TypeScript peer range to `<6.1.0`, so a
      # TypeScript 7 bump breaks `npm ci` with ERESOLVE. Keep prereleases
      # blocked too; drop this entry once typescript-eslint supports v7.
      - dependency-name: typescript
        versions: [">=7.0.0-0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-dependencies:
        patterns:
          - "*"
